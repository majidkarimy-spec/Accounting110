name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Make sure the app plugin matches the Capacitor version
        run: npm install @capacitor/app@$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")

      - name: Add Android platform
        run: npx cap add android

      - name: Patch manifest (storage and biometric permissions)
        run: python3 scripts/patch_android.py

      - name: Use fixed signing key (every build can update the previous one)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arman-accounting-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
